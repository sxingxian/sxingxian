version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tiptap:
        patterns: ['@tiptap/*']
      astro:
        patterns: ['astro', '@astrojs/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
