name: Deploy

# Manual deploy to Cloudflare Workers. Requires two GitHub repository secrets:
#   CLOUDFLARE_API_TOKEN   (token with "Edit Cloudflare Workers" permission)
#   CLOUDFLARE_ACCOUNT_ID
# Runtime secrets (DATABASE_URL, ACCESS_AUD, WP_WEBHOOK_SECRET, …) live in
# Cloudflare (`wrangler secret put`), never in GitHub or in the code.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run verify
      - name: Deploy worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
